# 持续集成：依赖安装、数据库迁移自检、Lint、类型检查、单元/集成测试与生产构建。
# 数据库为本地 SQLite（无需任何服务容器）；依赖 Redis 的队列集成测试
# 会在无 Redis 环境下自动跳过（本地开发接入已部署的 Redis 后照常运行）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 检查与构建
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本读取自根 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 数据库迁移自检（SQLite 全新库应用迁移 + 种子）
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: 管理台图标约束
        run: pnpm lint:console-icons

      - name: 管理台页面覆盖约束
        run: pnpm check:console-coverage

      - name: 敏感信息扫描
        run: pnpm security:scan

      - name: 格式检查
        run: pnpm format:check

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元与集成测试
        run: pnpm test

      - name: 生产构建
        run: pnpm build
